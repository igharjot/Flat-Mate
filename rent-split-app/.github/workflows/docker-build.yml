name: Docker Build

on:
  workflow_call:

jobs:
  docker-build:
    name: Build and Verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t splitnest:latest .

      - name: Start container
        run: |
          docker run -d --name splitnest -p 8000:8000 splitnest:latest
          sleep 5

      - name: Health check
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health)
          if [ "$status" != "200" ]; then exit 1; fi

      - name: Stop container
        if: always()
        run: docker rm -f splitnest